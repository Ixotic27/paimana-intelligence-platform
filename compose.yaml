services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paimana
      POSTGRES_USER: paimana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paimana"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://paimana:${POSTGRES_PASSWORD}@db:5432/paimana
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
